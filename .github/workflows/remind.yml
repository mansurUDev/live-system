name: tracker-reminders

# Дёргает api/tgRemind на Vercel по расписанию: сам эндпоинт решает, нужно ли
# что-то слать, и молчит, если статус в трекере уже верный. Vercel Hobby умеет
# только суточный cron — этой фиче нужно чаще, поэтому расписание живёт здесь.
#
# Часы UTC ниже — это ташкентские окна слотов (UTC+5) минус пять часов:
#   00–03 UTC = 05–08 Ташкент (подъём, дорога, работа)
#   12–13 UTC = 17–18 Ташкент (дорога домой)
#   16–18 UTC = 21–23 Ташкент (отбой)
# Остальные часы не дёргаем — там ни один слот всё равно не сработает, а
# минуты Actions на бесплатном плане ограничены.
on:
  schedule:
    - cron: '*/20 0-3,12-13,16-18 * * *'
  workflow_dispatch: {}

concurrency:
  group: remind
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Дёрнуть эндпоинт напоминаний
        env:
          URL: ${{ secrets.REMIND_URL }}
          SECRET: ${{ secrets.REMIND_SECRET }}
        run: |
          curl -sS -m 25 -o /dev/null -w 'HTTP %{http_code}\n' -X POST "$URL" \
            -H "x-remind-secret: $SECRET" \
            || echo "::warning::эндпоинт напоминаний не ответил"
